name: Daily lens ranking update

on:
  schedule:
    # 01:07 UTC = 10:07 Asia/Seoul (정각 실행 혼잡 회피)
    - cron: "7 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-lens-update
  cancel-in-progress: false

jobs:
  update:
    # ubuntu-latest 배포판 전환으로 Playwright 설치가 깨지는 것을 방지합니다.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Collect rankings and create report
        id: collect
        continue-on-error: true
        run: python cloud_daily.py

      - name: Commit updated ranking data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today.csv yesterday.csv queen_eyes_today.csv queen_eyes_yesterday.csv hotel_lovers_today.csv hotel_lovers_yesterday.csv ranking_*.csv trend_history.csv collection_status.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update daily lens rankings"
          git push

      - name: Create report and send email
        if: always()
        # SMTP/login trouble must not prevent the next scheduled collection or
        # turn an otherwise saved ranking update into a failed data run.
        continue-on-error: true
        env:
          NAVER_WORKS_SMTP_USER: ${{ secrets.NAVER_WORKS_SMTP_USER }}
          NAVER_WORKS_SMTP_APP_PASSWORD: ${{ secrets.NAVER_WORKS_SMTP_APP_PASSWORD }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
        run: python cloud_daily.py --skip-collection --send-email

      - name: Mark job failed when a collector failed
        if: steps.collect.outcome == 'failure'
        run: exit 1

      - name: Upload report and logs when the job fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-update-debug
          path: |
            daily_report.html
            debug_*.png
          if-no-files-found: ignore
          retention-days: 7
